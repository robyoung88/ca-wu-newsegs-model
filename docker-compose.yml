# Production stack.
#
# Run:
#   docker compose up --build --detach
#
# The app is served by gunicorn, using the code baked into the image (no live
# code mount), with NEWSEGS_ENV=production. The log viewer (dozzle) and the
# database browser (sqlite-web) are not started.
#
# For development (live code, debug tools, dozzle and sqlite-web), layer
# docker-compose.dev.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
x-app-environment: &app-environment
  PYTHONPATH: src
  NEWSEGS_ENV: production
  DYNACONF_DB_PATH: /var/lib/sqlite_data/newsegs_db.db
  DYNACONF_RESULTS_STORE: /mnt/network_share/results_store
  DYNACONF_DB_BACKUP_PATH: /mnt/network_share/db_backups
  DYNACONF_ENV_CACHE_PATH: /var/lib/sqlite_data/env_cache

x-app-volumes: &app-volumes
  # 1. The Database Mount (local persistent block storage)
  # A named Docker volume managed by Docker.
  - local_db_data:/var/lib/sqlite_data

  # 2. File server mount (deployment network drive)
  - ${HOST_NETWORK_SHARE_PATH:-./mock_network_drive}:/mnt/network_share

services:
  dash-app:
    build: .
    command: gunicorn --config gunicorn.conf.py app:server
    ports:
      - "8050:8050"
    environment: *app-environment
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      zmq-dispatcher:
        condition: service_healthy
    restart: unless-stopped

  zmq-dispatcher:
    build: .
    command: python src/newsegsmodelapp/backend/dispatcher.py
    environment: *app-environment
    volumes: *app-volumes
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/dispatcher_heartbeat.txt -mmin -0.25 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  maintenance-cron:
    build: .
    command: python src/newsegsmodelapp/backend/maintenance.py
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      zmq-dispatcher:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume managed by the Docker host engine
  local_db_data:
