[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ca_wu_newsegs_model"
version = "0.0.1"
authors = [
  { name="Robert Young", email="robert.young@wrexham.ac.uk" },
]
description = "A model for single-site energy generation, storage, consumption, import and export in support of the North Wales Social Housing Newbuild on-Site Energy Generation and Storage project."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/robyoung88/ca-wu-newsegs-model"
Issues = "https://github.com/robyoung88/ca-wu-newsegs-model/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------------
# Releases (python-semantic-release), run by .github/workflows/release.yml
# -----------------------------------------------------------------------------
# The version is taken from the Conventional Commits since the last tag. Releases are tags and GitHub
# Releases only: nothing is committed back, so `project.version` above is not updated.

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
# Versions start at 1.0.0: with an earlier 0.x release, the next release is 1.0.0, whatever its commits
allow_zero_version = false
no_git_verify = false

[tool.semantic_release.commit_parser_options]
# Pick up each Conventional Commit listed in the body of a squash merge
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.branches.canary]
match = "^canary$"
prerelease = true
prerelease_token = "canary"
