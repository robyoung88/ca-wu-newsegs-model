[default]
appversion = 'dev'

#dispatchservers = ['0.0.0.0','127.0.0.1']
dispatchservers = ['0.0.0.0','zmq-dispatcher']
FRONTENDPORT = 8555
BACKENDPORT = 8556
# HEARTBEAT_FILE defaults to the system temporary directory (see config/default_paths.py)

# Database backups are named <DB_FILENAME_ROOT>_<timestamp>.db
DB_FILENAME_ROOT = 'newsegs_db'

SprakeStartDatetime = "2005-01-01T00:00:00"
SprakeEndDatetime = "2015-01-01T00:00:00"
SprakeValidationLat = 53.25535
SprakeValidationLon = -3.47697

NEWAEntryPoint = "https://wps.neweuropeanwindatlas.eu/api/microscale-atlas/v1/"
NEWAMesoEntryPoint = "https://wps.neweuropeanwindatlas.eu/api/mesoscale-atlas/v1/"
NEWAMesoTSEntryPoint = "https://wps.neweuropeanwindatlas.eu/api/mesoscale-ts/v1/"
# (connect, read) timeouts (s) of requests for environmental data
NEWA_TIMEOUT_S = [10, 300]
PVGIS_TIMEOUT_S = [10, 120]
# Time (s) after which a lock on environmental data being fetched expires, so that a process which
# stops while fetching does not block the data (see environment_cache.get_or_set)
ENV_CACHE_LOCK_EXPIRE_S = 1800

PROGRESS_POLL_INTERVAL = 1000

# Location of the built documentation (mkdocs build), served at /documentation/. Defaults to ./site
#DOCS_PATH = '/opt/newsegs-docs'

JOB_DISPATCH_TIMEOUT_MS = 200
WORKER_RECEIVE_TIMEOUT_MS = 3000
WORKER_SHUTDOWN_TIMEOUT_S = 5

[testing]
#SprakeDataLoc = "@format {env[OneDrive]}\\Model\\Data\\Sprake"
SprakeExcelValidationLoc = "@format {env[OneDrive]}\\Model\\Validation"

[spraketest]
SprakeDataLoc = "@format {env[OneDrive]}\\Model\\Data\\SprakeTest"

[production]
appversion = '0.1.1'
dispatchservers = ['0.0.0.0','zmq-dispatcher']
# Watched by the zmq-dispatcher health check in docker-compose.yml
HEARTBEAT_FILE = '/tmp/dispatcher_heartbeat.txt'
