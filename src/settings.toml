[default]
appversion = 'dev'

#dispatchservers = ['0.0.0.0','127.0.0.1']
dispatchservers = ['0.0.0.0','zmq-dispatcher']
FRONTENDPORT = 8555
BACKENDPORT = 8556
HEARTBEAT_FILE = '/tmp/dispatcher_heartbeat.txt'

SprakeStartDatetime = "2005-01-01T00:00:00"
SprakeEndDatetime = "2015-01-01T00:00:00"
SprakeValidationLat = 53.25535
SprakeValidationLon = -3.47697

NEWAEntryPoint = "https://wps.neweuropeanwindatlas.eu/api/microscale-atlas/v1/"
