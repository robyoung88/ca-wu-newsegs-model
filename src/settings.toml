SprakeExcelValidationLoc = "@format {env[OneDrive]}\\Model\\Validation"

[spraketest]
SprakeDataLoc = "@format {env[OneDrive]}\\Model\\Data\\SprakeTest"

[production]
appversion = '0.1.1'
