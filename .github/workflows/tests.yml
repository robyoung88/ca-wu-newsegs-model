name: tests

# Runs the test suite on every pull request into the staged branches, and on every push to development.
# The job name `tests` is the status check required by the branch rulesets.

on:
  pull_request:
    branches:
      - development
      - canary
      - main
  # Pushes to canary and main are tested by the release workflow, which calls this one.
  push:
    branches:
      - development
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # A login shell, so that the conda environment is active in each step
        shell: bash -el {0}
    env:
      PYTHONPATH: ./src
      PVLIB_USE_NUMBA: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: conda-environment.yml
          activate-environment: ca-wu-newsegs-mod
          conda-remove-defaults: true

      - name: Install pip dependencies
        run: pip install -r requirements-pip.txt

      - name: Run tests
        run: python -m unittest discover -v -s ./test -p 'test*.py'
