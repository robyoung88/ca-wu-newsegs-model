name: pull request title

# Pull requests into development are squash-merged, so their title becomes the commit message
# that python-semantic-release reads. It must therefore be a Conventional Commit header, e.g.
#   feat: add a location to the map        -> minor release
#   fix: correct the export tariff         -> patch release
#   feat!: change the project file format  -> major release
# A breaking change may instead be given by a `BREAKING CHANGE: ...` footer in the PR description.

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
