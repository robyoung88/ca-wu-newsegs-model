name: unit tests

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  prepare-default-models:
    uses: ./.github/workflows/prepare-default-models.yml

  unit-tests:
    needs: prepare-default-models
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run unit tests
        run: >-
          python -m pytest test/unit_tests
          -k "not test_excel_validation"
          --ignore=test/unit_tests/test_dsa
          --ignore=test/unit_tests/test_psa
          --ignore=test/unit_tests/test_dsa_multiple.py
          --ignore=test/unit_tests/test_psa_multiple.py
