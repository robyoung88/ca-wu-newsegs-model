name: enhanced unit tests

# Run by release.yml on pushes to main, before the release is made.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-default-models:
    uses: ./.github/workflows/prepare-default-models.yml

  sensitivity-tests:
    needs: prepare-default-models
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run PSA and DSA tests
        run: >-
          python -m pytest
          test/unit_tests/test_dsa
          test/unit_tests/test_dsa_multiple.py
          test/unit_tests/test_psa
          test/unit_tests/test_psa_multiple.py
