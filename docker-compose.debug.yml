# Debugging overrides, layered on top of docker-compose.yml and docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.debug.yml up --build dash-app
# Then attach with the "Attach to Dash app in Docker" launch configuration.
services:
  dash-app:
    command: python -m debugpy --listen 0.0.0.0:5678 --wait-for-client src/app.py
    ports:
      - "5678:5678"
